                  val t = rememberInfiniteTransition(label = "spin")
                  t.animateFloat(0f, 360f, infiniteRepeatable(tween(6000, easing = LinearEasing)), label = "rot").value
              } else 0f
              Canvas(Modifier.size(dp).rotate(rot)) {
                  val r = this.size.minDimension / 2f
                  for (i in 0 until 12) {
                      val a = Math.toRadians(i * 30.0 + (i % 3) * 5.0).toFloat()
                      val len = if (i % 2 == 0) r else r * 0.74f
                      val s = r * 0.14f
                      drawLine(
                          color,
                          Offset(center.x + cos(a) * s, center.y + sin(a) * s),
                          Offset(center.x + cos(a) * len, center.y + sin(a) * len),
                          strokeWidth = r * 0.17f, cap = StrokeCap.Round
