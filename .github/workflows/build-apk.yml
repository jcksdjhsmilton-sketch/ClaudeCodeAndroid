          // ------------------------------------------------------------ Markdown leve
          @Composable
          fun Markdown(text: String) {
              val cs = MaterialTheme.colorScheme
              val parts = text.split("```")
              Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  parts.forEachIndexed { i, p ->
                      if (i % 2 == 1) {
                          CodeBlock(p.substringAfter('\n', p).trimEnd('\n'))
                      } else if (p.isNotBlank()) {
                          Text(
                              mdInline(p.trim('\n'), cs.surfaceVariant),
                              fontFamily = FontFamily.Serif, fontSize = 16.sp, lineHeight = 25.sp, color = cs.onBackground
                          )
                      }
                  }
              }
          }

          fun mdInline(src: String, codeBg: Color): AnnotatedString = buildAnnotatedString {
              val head = Regex("^#{1,6}\\s+")
              val bullet = Regex("^\\s*[-*]\\s+")
              src.lines().forEachIndexed { li, raw ->
                  if (li > 0) append("\n")
                  var line = raw
                  val h = head.find(line)
                  if (h != null) {
                      line = line.substring(h.value.length)
                      withStyle(SpanStyle(fontWeight = FontWeight.Bold, fontSize = 18.sp)) { mdSpan(line, codeBg) }
                  } else {
                      val b = bullet.find(line)
                      if (b != null) { append("•  "); line = line.substring(b.value.length) }
                      mdSpan(line, codeBg)
                  }
              }
          }

          private fun AnnotatedString.Builder.mdSpan(s: String, codeBg: Color) {
              var i = 0
              while (i < s.length) {
                  if (s.startsWith("**", i)) {
                      val e = s.indexOf("**", i + 2)
                      if (e > 0) {
                          withStyle(SpanStyle(fontWeight = FontWeight.Bold)) { append(s.substring(i + 2, e)) }
                          i = e + 2; continue
                      }
                  }
                  if (s[i] == '`') {
                      val e = s.indexOf('`', i + 1)
                      if (e > 0) {
                          withStyle(SpanStyle(fontFamily = FontFamily.Monospace, background = codeBg, fontSize = 14.sp)) {
                              append(s.substring(i + 1, e))
                          }
                          i = e + 1; continue
                      }
                  }
                  append(s[i]); i++
              }
          }

          @Composable
          fun CodeBlock(code: String) {
              val cs = MaterialTheme.colorScheme
              val clip = LocalClipboardManager.current
              var copied by remember { mutableStateOf(false) }
              Column(Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(cs.surfaceVariant)) {
                  Row(Modifier.fillMaxWidth().padding(end = 4.dp), horizontalArrangement = Arrangement.End) {
                      TextButton(onClick = { clip.setText(AnnotatedString(code)); copied = true }) {
                          Text(if (copied) "Copiado" else "Copiar", fontSize = 12.sp, color = cs.onSurfaceVariant)
                      }
                  }
                  Box(Modifier.horizontalScroll(rememberScrollState()).padding(start = 12.dp, end = 12.dp, bottom = 12.dp)) {
                      Text(code, fontFamily = FontFamily.Monospace, fontSize = 13.sp, lineHeight = 18.sp, color = cs.onBackground)
                  }
              }
          }

          // ------------------------------------------------------------ Barra de entrada
          @Composable
          fun InputBar(value: String, onChange: (String) -> Unit, running: Boolean, onSend: () -> Unit, onStop: () -> Unit) {
              val cs = MaterialTheme.colorScheme
              val active = running || value.isNotBlank()
              Surface(
                  shape = RoundedCornerShape(26.dp), color = cs.surface,
                  border = BorderStroke(1.dp, cs.outline), shadowElevation = 2.dp,
                  modifier = Modifier.padding(12.dp).fillMaxWidth()
              ) {
                  Row(Modifier.padding(start = 18.dp, end = 8.dp, top = 6.dp, bottom = 6.dp), verticalAlignment = Alignment.Bottom) {
                      Box(Modifier.weight(1f).padding(vertical = 10.dp)) {
                          if (value.isEmpty()) Text("Peça algo ao Claude Code…", color = cs.onSurfaceVariant, fontSize = 16.sp)
                          BasicTextField(
                              value = value, onValueChange = onChange,
                              textStyle = TextStyle(color = cs.onSurface, fontSize = 16.sp),
                              cursorBrush = SolidColor(C.brand), maxLines = 6, modifier = Modifier.fillMaxWidth()
                          )
                      }
                      Spacer(Modifier.width(8.dp))
                      Box(
                          Modifier.size(40.dp).clip(CircleShape)
                              .background(if (active) C.brand else cs.outline)
                              .clickable(enabled = active) { if (running) onStop() else onSend() },
                          contentAlignment = Alignment.Center
                      ) {
                          Canvas(Modifier.size(16.dp)) {
                              val w = size.width; val h = size.height; val sw = 2.2.dp.toPx()
                              if (running) {
                                  drawRoundRect(Color.White, cornerRadius = CornerRadius(3.dp.toPx()))
                              } else {
                                  drawLine(Color.White, Offset(w / 2, h), Offset(w / 2, 0f), sw, StrokeCap.Round)
                                  drawLine(Color.White, Offset(0f, h * 0.45f), Offset(w / 2, 0f), sw, StrokeCap.Round)
                                  drawLine(Color.White, Offset(w, h * 0.45f), Offset(w / 2, 0f), sw, StrokeCap.Round)
                              }
                          }
                      }
                  }
              }
          }

