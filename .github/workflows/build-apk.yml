          fun testGateway(base: String, mode: String, token: String, model: String, headers: String): String {
              return try {
                  val root = base.trim().ifBlank { "https://api.anthropic.com" }.trimEnd('/')
                  val c = java.net.URL("$root/v1/messages").openConnection() as java.net.HttpURLConnection
                  c.requestMethod = "POST"; c.connectTimeout = 15000; c.readTimeout = 30000; c.doOutput = true
                  c.setRequestProperty("content-type", "application/json")
                  c.setRequestProperty("anthropic-version", "2023-06-01")
                  when (mode) {
                      "apikey" -> c.setRequestProperty("x-api-key", token.trim())
                      "oauth" -> {
                          c.setRequestProperty("authorization", "Bearer ${token.trim()}")
                          c.setRequestProperty("anthropic-beta", "oauth-2025-04-20")
                      }
                      else -> c.setRequestProperty("authorization", "Bearer ${token.trim()}")
                  }
                  headers.lines().forEach { l ->
                      val i = l.indexOf(':')
                      if (i > 0) c.setRequestProperty(l.substring(0, i).trim(), l.substring(i + 1).trim())
                  }
                  val m = model.trim().ifBlank { "claude-haiku-5-5" }
                  val body = JSONObject().put("model", m).put("max_tokens", 1)
                      .put("messages", JSONArray().put(JSONObject().put("role", "user").put("content", "ping")))
                      .toString()
                  c.outputStream.use { it.write(body.toByteArray()) }
                  val code = c.responseCode
                  val txt = (if (code in 200..299) c.inputStream else c.errorStream)?.bufferedReader()?.readText().orEmpty()
                  if (code in 200..299) "✓ Conexão OK (HTTP $code)" else "✗ HTTP $code — ${txt.take(240)}"
              } catch (e: Exception) {
                  "✗ ${e.javaClass.simpleName}: ${e.message}"
              }
          }

          @Composable
          fun SettingsScreen(onBack: () -> Unit) {
              val ctx = LocalContext.current
              val cs = MaterialTheme.colorScheme
              val p = remember { Prefs(ctx) }
              var base by remember { mutableStateOf(p.baseUrl) }
              var mode by remember { mutableStateOf(p.authMode) }
              var token by remember { mutableStateOf(p.token) }
              var model by remember { mutableStateOf(p.model) }
              var headers by remember { mutableStateOf(p.headers) }
              var extra by remember { mutableStateOf(p.extraEnv) }
              var perm by remember { mutableStateOf(p.permMode) }
              var msg by remember { mutableStateOf("") }
              var testing by remember { mutableStateOf(false) }
              var confirmReset by remember { mutableStateOf(false) }
              var saved by remember { mutableStateOf(false) }
              val scope = rememberCoroutineScope()
              val version by InstallState.version.collectAsState()

              fun save() {
                  p.baseUrl = base.trim(); p.authMode = mode; p.token = token.trim(); p.model = model.trim()
                  p.headers = headers.trim(); p.extraEnv = extra.trim(); p.permMode = perm
                  saved = true
              }

              fun reinstall(wipe: Boolean) {
                  if (InstallState.phase.value == InstallState.Phase.RUNNING || BgService.installing) return
                  scope.launch {
                      withContext(Dispatchers.IO) {
                          val e = Env(ctx)
                          if (wipe) { rmrf(e.root); e.rootOk.delete() }
                          e.okFile.delete()
                      }
                      InstallState.ready.value = false
                      startInstall(ctx)
                      onBack()
                  }
              }

              Column(Modifier.fillMaxSize()) {
                  Row(Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = onBack) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "Voltar") }
                      Text("Ajustes", fontFamily = FontFamily.Serif, fontSize = 22.sp)
                  }
                  Column(
                      Modifier.weight(1f).verticalScroll(rememberScrollState()).padding(horizontal = 20.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Section("Gateway / API")
                      Text(
                          "Deixe a URL em branco para usar a API oficial. Em um Gateway (LiteLLM, proxy corporativo, Bedrock/Vertex via proxy…) informe a URL base sem /v1.",
                          fontSize = 13.sp, color = cs.onSurfaceVariant
                      )
                      Field("URL base (ANTHROPIC_BASE_URL)", base, { base = it; saved = false }, "https://api.anthropic.com", kb = KeyboardType.Uri)
                      Text("Autenticação", fontSize = 13.sp, color = cs.onSurfaceVariant)
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf("bearer" to "Bearer", "apikey" to "API Key", "oauth" to "OAuth").forEach { (k, l) ->
                              FilterChip(
                                  selected = mode == k, onClick = { mode = k; saved = false }, label = { Text(l) },
                                  colors = FilterChipDefaults.filterChipColors(
                                      selectedContainerColor = C.brand.copy(alpha = 0.15f), selectedLabelColor = C.brand
                                  )
                              )
                          }
                      }
                      Text(
                          when (mode) {
                              "apikey" -> "Enviado como x-api-key (ANTHROPIC_API_KEY)."
                              "oauth" -> "Token da sua assinatura: gere com  claude setup-token  (CLAUDE_CODE_OAUTH_TOKEN)."
                              else -> "Enviado como Authorization: Bearer (ANTHROPIC_AUTH_TOKEN). Padrão para gateways."
                          },
                          fontSize = 12.sp, color = cs.onSurfaceVariant
                      )
                      Field("Token / chave", token, { token = it; saved = false }, secret = true)
                      Field("Modelo (opcional)", model, { model = it; saved = false }, "ex.: claude-sonnet-5-5")
                      Field("Cabeçalhos extras", headers, { headers = it; saved = false }, "Nome: valor (um por linha)", multi = true)
                      Field("Variáveis de ambiente extras", extra, { extra = it; saved = false }, "CHAVE=valor (uma por linha)", multi = true)
                      OutlinedButton(
                          enabled = !testing,
                          onClick = {
                              testing = true; msg = "Testando…"
                              scope.launch {
                                  msg = withContext(Dispatchers.IO) { testGateway(base, mode, token, model, headers) }
                                  testing = false
                              }
                          }
                      ) { Text("Testar conexão", color = C.brand) }
                      if (msg.isNotEmpty()) {
                          SelectionContainer {
                              Text(msg, fontSize = 13.sp, color = if (msg.startsWith("✓")) C.brand else cs.onSurfaceVariant)
                          }
                      }

                      Section("Permissões do Claude Code")
                      Choice(perm == "acceptEdits", "Aceitar edições (recomendado)", "Pode ler, editar, escrever e rodar comandos Bash na pasta de trabalho.") { perm = "acceptEdits"; saved = false }
                      Choice(perm == "plan", "Somente planejar", "Analisa e propõe um plano, sem alterar nada.") { perm = "plan"; saved = false }
                      Choice(perm == "bypass", "Tudo liberado", "Sem pedidos de confirmação. Roda isolado no Linux embutido do app.") { perm = "bypass"; saved = false }

                      Section("Ambiente")
                      Text(
                          if (version.isNotBlank()) "Instalado: $version" else "Claude Code ainda não instalado.",
                          fontSize = 14.sp, color = cs.onSurfaceVariant
                      )
                      OutlinedButton(onClick = { reinstall(false) }) { Text("Atualizar Claude Code", color = C.brand) }
                      OutlinedButton(onClick = { confirmReset = true }) { Text("Reinstalar do zero", color = cs.error) }
                      Spacer(Modifier.height(8.dp))
                  }
                  Button(
                      onClick = { save() },
                      modifier = Modifier.fillMaxWidth().padding(16.dp).height(50.dp),
                      shape = RoundedCornerShape(25.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = C.brand, contentColor = Color.White)
                  ) { Text(if (saved) "Salvo ✓" else "Salvar", fontSize = 16.sp) }
              }

              if (confirmReset) {
                  AlertDialog(
                      onDismissRequest = { confirmReset = false },
                      title = { Text("Reinstalar do zero?") },
                      text = { Text("Apaga o Linux embutido, a pasta /root/workspace e tudo que foi instalado. Os ajustes são mantidos.") },
                      confirmButton = { TextButton(onClick = { confirmReset = false; reinstall(true) }) { Text("Apagar e reinstalar", color = cs.error) } },
                      dismissButton = { TextButton(onClick = { confirmReset = false }) { Text("Cancelar") } }
                  )
              }
          }
          EOF

      # ------------------------------------------------------------
      # 6) Assinatura + build + verificação
      # ------------------------------------------------------------
      - name: Keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$KEYSTORE_PATH"
            echo "Usando keystore dos secrets"
          else
            keytool -genkeypair -keystore "$KEYSTORE_PATH" -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Claude Code Mobile, O=Local"
            # PKCS12 so aceita senha da chave = senha do keystore; o Gradle precisa saber disso
            echo "KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Keystore temporaria gerada (adicione os secrets para manter a mesma assinatura)"
          fi

      - name: Compilar APK
        run: gradle -p android --no-daemon --stacktrace assembleRelease

      - name: Verificar APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" > apk-list.txt
          grep -q 'assets/rootfs.tar.gz' apk-list.txt
          mkdir -p out
          cp "$APK" out/ClaudeCodeMobile.apk
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeCodeMobile-apk
          path: out/ClaudeCodeMobile.apk
          if-no-files-found: error
